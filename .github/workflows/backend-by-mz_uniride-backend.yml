name: Build and deploy Node.js app to Azure Web App - uniride-backend

on:
  push:
    branches:
      - backend-by-mz
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install
        run: npm install

      - name: Zip only backend files
        run: |
          zip -r release.zip . \
            -x "android/**" \
            -x "ios/**" \
            -x "lib/**" \
            -x "web/**" \
            -x "test/**" \
            -x ".dart_tool/**" \
            -x "pubspec.yaml" \
            -x "pubspec.lock" \
            -x "analysis_options.yaml" \
            -x ".metadata" \
            -x ".git/**"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_44BDE2754D064A07AC8EA5D80D1C5326 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1A7E599353884ABBAFEA0AED8A4B803E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4FE27A8F0D934186BAE0EB02EC334657 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'uniride-backend'
          slot-name: 'Production'
          package: release.zip
